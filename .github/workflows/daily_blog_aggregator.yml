name: Daily Blogs & Content Aggregator

on:
  schedule:
    - cron: '0 14 * * *'  # 6:00 AM PST / 2:00 PM UTC daily
  workflow_dispatch:

jobs:
  aggregate_content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run Content Aggregator
        run: python scripts/daily_content_aggregator.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/blog_cache.json data/dynamic_question_bank.json data/hot_papers.json
          git diff --staged --quiet || git commit -m "chore(data): auto-update blogs & dynamic questions"
          git push
