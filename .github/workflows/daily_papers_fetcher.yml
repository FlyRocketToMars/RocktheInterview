name: Daily Hot Papers Fetcher

on:
  schedule:
    - cron: '30 6 * * *'  # Run daily at 6:30 AM UTC (covers US/Asia timezones)
  workflow_dispatch:

jobs:
  fetch_papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Hot Papers Fetcher
        run: python scripts/fetch_hot_papers.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/hot_papers.json
          git commit -m "chore(papers): auto-update hot papers from arXiv, HuggingFace, PapersWithCode" || exit 0
          git push
